<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="mapa-title">Mapa | AkademiaUniversalis</title>
  <meta name="description" content="Explora mapas interactivos de AkademiaUniversalis: mundo, historia, clima y celeste.">
  <meta name="theme-color" content="#0a0f1a">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/main.js"></script>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="mapas.html" class="logo">
        <div class="logo-mark" aria-hidden="true">AU</div>
        <span>AkademiaUniversalis</span>
      </a>

      <button class="mobile-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="materias.html">Materias</a>
        <a href="aula.html">Aula Virtual</a>
        <a href="rutas.html">Rutas</a>
        <a href="biblioteca.html">Biblioteca</a>
        <a href="mapas.html">Mapas</a>
        <a href="astronomia.html">Astronomía</a>
        <a href="comunidad.html">Comunidad</a>
        <a href="logros.html">Logros</a>
        <a href="profesor.html">Profesor</a>
        <a href="institucion.html">Institución</a>
        <a href="precios.html" class="btn-ghost">Precios</a>
        <a href="auth.html" class="btn-primary" style="margin-left:8px;">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <section style="padding:90px 0 60px;">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
        <a href="mapas.html" class="btn-ghost" style="display:flex; align-items:center; gap:8px;">
          <span>←</span> Volver a mapas
        </a>
        <div id="mapa-titulo" style="background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:8px 16px; font-size:0.9rem; color:var(--muted);">Mapa</div>
      </div>

      <div style="background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:32px; display:flex; flex-direction:column; gap:24px; min-height:500px;">
        <h2 id="mapa-nombre" style="font-size:1.75rem; margin:0;">Mapa</h2>
        <p id="mapa-descripcion" style="color:var(--muted); font-size:1rem; margin:0;">Descripción del mapa.</p>
        <div id="mapa-contenido" style="display:flex; justify-content:center; align-items:center; min-height:340px; background:#0b0f1a; border:1px solid var(--border); border-radius:16px; overflow:auto;">
          <div style="text-align:center; color:var(--muted); padding:40px 20px;">Cargando mapa...</div>
        </div>
      </div>

      <div style="text-align:center; margin-top:24px;">
        <a href="astronomia.html" class="btn-outline" style="padding:10px 24px;">Ir al planetario 3D</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container" style="text-align:center; padding:40px 0;">
      <p style="color:var(--muted); font-size:0.9rem;">© 2026 AkademiaUniversalis. Universidad virtual.</p>
    </div>
  </footer>

  <script>
    const mapas = {
      mundial: {
        nombre: 'Mapa Mundial',
        descripcion: 'Países, capitales, fronteras y datos demográficos de todo el planeta.',
        svg: `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; max-width:400px;">
          <rect width="400" height="220" fill="#0e1422" rx="12"/>
          <path d="M20 60 Q120 20 220 50 Q320 80 300 140 Q220 190 100 170 Q30 140 20 110 Z" fill="var(--accent)" opacity="0.9"/>
          <circle cx="80" cy="100" r="4" fill="#fff"/>
          <circle cx="150" cy="70" r="3.5" fill="#fff"/>
          <circle cx="240" cy="110" r="3" fill="#fff"/>
          <circle cx="300" cy="80" r="2.5" fill="#fff"/>
          <text x="200" y="200" font-family="sans-serif" font-size="12" fill="var(--muted)" text-anchor="middle">Mapa mundial estilizado — AkademiaUniversalis</text>
        </svg>`
      },
      historico: {
        nombre: 'Mapa Histórico',
        descripcion: 'Imperios, civilizaciones y cambios territoriales a través de los siglos.',
        svg: `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; max-width:400px;">
          <rect width="400" height="220" fill="#0e1422" rx="12"/>
          <path d="M60 90 Q140 60 220 80 Q280 50 340 90 Q320 160 240 150 Q150 170 80 140 Z" fill="var(--gold)" opacity="0.9"/>
          <circle cx="90" cy="130" r="4" fill="#fff"/>
          <circle cx="180" cy="100" r="3.5" fill="#fff"/>
          <circle cx="270" cy="120" r="3" fill="#fff"/>
          <circle cx="320" cy="90" r="2.5" fill="#fff"/>
          <text x="200" y="200" font-family="sans-serif" font-size="12" fill="var(--muted)" text-anchor="middle">Mapa histórico estilizado — AkademiaUniversalis</text>
        </svg>`
      },
      clima: {
        nombre: 'Clima y Tiempo',
        descripcion: 'Zonas climáticas, corrientes oceánicas y patrones meteorológicos globales.',
        svg: `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; max-width:400px;">
          <rect width="400" height="220" fill="#0e1422" rx="12"/>
          <path d="M40 100 Q120 70 220 90 Q300 110 360 90 Q340 160 260 150 Q160 170 80 140 Z" fill="var(--green)" opacity="0.9"/>
          <path d="M100 110 Q160 80 240 110 Q300 140 340 110" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
          <circle cx="120" cy="120" r="5" fill="#fff" opacity="0.8"/>
          <circle cx="260" cy="100" r="4" fill="#fff" opacity="0.8"/>
          <circle cx="300" cy="130" r="3" fill="#fff" opacity="0.8"/>
          <text x="200" y="200" font-family="sans-serif" font-size="12" fill="var(--muted)" text-anchor="middle">Mapa climático estilizado — AkademiaUniversalis</text>
        </svg>`
      },
      celeste: {
        nombre: 'Mapa Celeste',
        descripcion: 'Constelaciones, estrellas visibles y coordenadas celestes desde la Tierra.',
        svg: `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; max-width:400px;">
          <rect width="400" height="220" fill="#050a14" rx="12"/>
          <circle cx="60" cy="50" r="2" fill="#fff"/>
          <circle cx="100" cy="80" r="2.5" fill="#fff"/>
          <circle cx="140" cy="60" r="1.8" fill="#fff"/>
          <circle cx="180" cy="100" r="2.2" fill="#fff"/>
          <circle cx="220" cy="70" r="1.6" fill="#fff"/>
          <circle cx="280" cy="90" r="2.4" fill="#fff"/>
          <circle cx="320" cy="130" r="2" fill="#fff"/>
          <circle cx="360" cy="50" r="1.9" fill="#fff"/>
          <circle cx="90" cy="150" r="2.1" fill="#fff"/>
          <circle cx="200" cy="160" r="2.3" fill="#fff"/>
          <path d="M60 50 L100 80 L140 60 L180 100" stroke="#fff" stroke-width="1" fill="none" opacity="0.4"/>
          <path d="M220 70 L280 90 L320 130" stroke="#fff" stroke-width="1" fill="none" opacity="0.4"/>
          <text x="200" y="200" font-family="sans-serif" font-size="12" fill="var(--muted)" text-anchor="middle">Mapa celeste estilizado — AkademiaUniversalis</text>
        </svg>`
      }
    };

    const params = new URLSearchParams(window.location.search);
    const mapaKey = params.get('mapa');
    const mapa = mapas[mapaKey];

    const titulo = document.getElementById('mapa-titulo');
    const nombre = document.getElementById('mapa-nombre');
    const desc = document.getElementById('mapa-descripcion');
    const contenido = document.getElementById('mapa-contenido');
    const title = document.getElementById('mapa-title');

    if (!mapa) {
      if (nombre) nombre.textContent = 'Mapa no encontrado';
      if (desc) desc.textContent = 'El mapa solicitado no existe.';
      if (contenido) contenido.innerHTML = '<div style="text-align:center; color:var(--muted); padding:40px 20px;">Mapa no encontrado.</div>';
      if (titulo) { titulo.textContent = 'Error'; titulo.style.borderColor = 'var(--red)'; }
      if (title) title.textContent = 'Mapa no encontrado | AkademiaUniversalis';
    } else {
      if (titulo) { titulo.textContent = mapa.nombre; titulo.style.color = 'var(--text)'; }
      if (nombre) nombre.textContent = mapa.nombre;
      if (desc) desc.textContent = mapa.descripcion;
      if (contenido) contenido.innerHTML = mapa.svg;
      if (title) title.textContent = mapa.nombre + ' | AkademiaUniversalis';
    }
  </script>
</body>
</html>
